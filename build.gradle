plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

group = mod_group_id
version = mod_version
base.archivesName = mod_id
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDirectory project.file('run')
            args '--mixin.config', 'quickclaim.mixins.json'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            mods {
                quickclaim { source sourceSets.main }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf('maven.modrinth:geckolib:aC5KMoNg')
    if (providers.gradleProperty('gecko').isPresent()) {
        runtimeOnly fg.deobf('maven.modrinth:geckolib:aC5KMoNg')
    }
}

mixin { add sourceSets.main, 'quickclaim.refmap.json' }

tasks.named('processResources', ProcessResources) {
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version]
    inputs.properties properties
    filesMatching('META-INF/mods.toml') { expand properties }
}

tasks.named('jar', Jar) {
    manifest.attributes('Implementation-Version': project.version, 'MixinConfigs': 'quickclaim.mixins.json')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
